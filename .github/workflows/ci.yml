name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAILMCP_KEYCLOAK_URL: http://127.0.0.1:18088
      MAILMCP_KEYCLOAK_CREDENTIALS_FILE: /tmp/mailmcp-test-operator.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable identity provider
        run: |
          docker run -d --name mailmcp-keycloak-test -p 127.0.0.1:18088:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=integration-test-only-password \
            quay.io/keycloak/keycloak:26.7.3 start-dev
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile(process.env.MAILMCP_KEYCLOAK_CREDENTIALS_FILE, JSON.stringify({
            url: process.env.MAILMCP_KEYCLOAK_URL,
            username: 'admin', password: 'integration-test-only-password'
          }), { mode: 0o600 });
          for (let attempt = 0; attempt < 60; attempt++) {
            const controller = new AbortController();
            // Keep the readiness attempt alive while a starting container resets sockets.
            const deadline = setTimeout(() => controller.abort(), 2000);
            try {
              const response = await fetch(`${process.env.MAILMCP_KEYCLOAK_URL}/realms/master`, { signal: controller.signal });
              if (response.ok) process.exit(0);
            } catch {} finally { clearTimeout(deadline); }
            await new Promise(resolve => setTimeout(resolve, 2000));
          }
          throw new Error('Keycloak did not become ready');
          NODE
      - name: Verify fresh import, migration, DCR, PKCE, consent and tokens
        run: node scripts/test-keycloak-config.mjs
      - name: Remove disposable identity provider
        if: always()
        run: docker rm -f mailmcp-keycloak-test
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --pull -t mailmcp:ci .
      - name: Scan runtime image for high and critical vulnerabilities
        run: |
          docker save -o /tmp/mailmcp-image.tar mailmcp:ci
          chmod 0444 /tmp/mailmcp-image.tar
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges \
            -v /tmp/mailmcp-image.tar:/scan/image.tar:ro \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --input /scan/image.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1
