# Paste in this host's Advanced / Custom Nginx Configuration field.
# Keep Cache Assets OFF. Hostname: mailmcp, port: 3210, scheme: http.
# Enable Force SSL after obtaining the domain certificate.
client_max_body_size 40m;
# Keep HTTP/2 uploads flowing across high-latency connections without disk buffering.
client_body_buffer_size 1m;
http2_body_preread_size 1m;
client_body_timeout 15s;
send_timeout 60s;
proxy_read_timeout 65s;
proxy_send_timeout 65s;
proxy_buffering off;
proxy_request_buffering off;
proxy_max_temp_file_size 0;
# OAuth callbacks carry one-time codes: do not store URLs in access logs.
access_log off;
